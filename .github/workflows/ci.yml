name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest ruff redis
      - run: ruff check .
      - run: pytest -q -rs

  redis-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
      - run: bash scripts/smoke.sh
      - name: Benchmark (for reference; shared CI machines are noisy)
        run: |
          python -m minidis --port 6380 &
          sleep 1
          redis-benchmark -p 6380 -t set,get -n 20000 -q
