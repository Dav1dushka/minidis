[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidis"
dynamic = ["version"]
description = "A small Redis-compatible server in pure Python: RESP protocol, TTLs, AOF persistence"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Davyd Velychko" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
minidis = "minidis.__main__:main"

[tool.setuptools]
packages = ["minidis"]

[tool.setuptools.dynamic]
version = { attr = "minidis.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
